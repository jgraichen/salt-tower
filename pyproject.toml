[project]
name = "salt-tower"
version = "1.13.0"
description = "A Flexible External Salt Pillar Module"
authors = [{ name = "Jan Graichen", email = "jgraichen@altimos.de" }]
dependencies = ["salt"]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
homepage = "https://github.com/jgraichen/salt-tower"

[project.entry-points."salt.loader"]
pillar_dirs = "salt_tower.loader:pillar_dirs"
render_dirs = "salt_tower.loader:renderers_dirs"

[project.optional-dependencies]
docs = [
    "mike==2.2.0",
    "mkdocs-awesome-pages-plugin==2.10.1",
    "mkdocs-git-revision-date-plugin==0.3.2",
    'mkdocs-material==9.7.7',
    "setuptools",                             # required by mike
]

[dependency-groups]
test = ["pylint==4.0.8", "pytest==9.1.1"]
lint = ["ruff==0.16.6"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "mypy==2.3.1",
    "nox~=2025.5.1",
    "pyright~=1.1.356",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
include = ["salt_tower", "test"]
exclude = [
    "test/fixtures",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
builtins = ["__grains__", "__opts__", "__pillar__", "__salt__"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    # Invalid tower data is a data error surfaced to the user, not a
    # programming error, therefore the pillar raises `ValueError`.
    "TRY004",
]
